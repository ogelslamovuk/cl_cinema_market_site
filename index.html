<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#090b13">
    <title>Вход — Cinemalab Market Intelligence</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="login-page">
    <main class="login-shell" aria-labelledby="login-title">
      <section class="login-panel">
        <div class="login-brand" aria-label="Cinemalab Market Intelligence">
          <span class="brand-mark" aria-hidden="true">CL</span>
          <span>Cinemalab <small>Market Intelligence</small></span>
        </div>

        <div class="login-copy">
          <p class="context-line">Доступ к dashboard</p>
          <h1 id="login-title">Кинорынок Беларуси</h1>
          <p>Введите логин и пароль, чтобы открыть рабочий dashboard.</p>
        </div>

        <form class="login-form" id="login-form" novalidate>
          <label>
            <span>Логин</span>
            <input id="login-user" name="user" autocomplete="username" required>
          </label>
          <label>
            <span>Пароль</span>
            <input id="login-password" name="password" type="password" autocomplete="current-password" required>
          </label>
          <p class="login-error" id="login-error" role="alert" aria-live="polite"></p>
          <button type="submit">Открыть dashboard <span aria-hidden="true">→</span></button>
        </form>
      </section>
    </main>
    <script src="auth.js"></script>
  </body>
</html>
