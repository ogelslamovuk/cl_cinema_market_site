# Same existing close service/schedule. Media errors do not fail financial publication.
[Service]
ReadWritePaths=/opt/cinema-market-site/.git
ExecStartPost=-/usr/bin/timeout 120 /var/lib/cinema-market/poster-tools/.venv/bin/python -B /opt/cinema-market-site/ops/refresh_posters.py --site-repo /opt/cinema-market-site --db-config /etc/cinema-market/mooon-db.yaml --worktree /var/lib/cinema-market/runtime/posters/site --publish
