# Same existing close service/schedule. Media errors do not fail financial publication.
[Service]
ExecStartPost=-/usr/bin/timeout 120 /var/lib/cinema-market/poster-tools/.venv/bin/python /opt/cinema-market-site/ops/refresh_posters.py --site-repo /opt/cinema-market-site --db-config /etc/cinema-market/mooon-db.yaml --worktree /var/lib/cinema-market/poster-site --publish
